<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0f1d">
  <title>PCES Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ================= SIGN IN ================= -->
  <main class="auth" id="authView" hidden>
    <form class="card" id="loginForm" novalidate>
      <img class="logo" src="logo.png" alt="PCES logo" width="150" height="92">
      <h1>Admin sign in</h1>
      <p class="sub">Council members only.</p>

      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="loginPass">Password</label>
        <div class="pw">
          <input type="password" id="loginPass" autocomplete="current-password" placeholder="Your password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
        </div>
      </div>

      <p class="form-error" id="loginError" role="alert"></p>

      <button class="btn primary block" id="loginBtn" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span class="lbl">Sign in</span>
      </button>
    </form>
  </main>

  <!-- ================= NOT AUTHORISED ================= -->
  <main class="auth" id="deniedView" hidden>
    <div class="card">
      <div class="denied-icon" aria-hidden="true">!</div>
      <h1>Not authorised</h1>
      <p class="sub">You are signed in as <strong id="deniedEmail"></strong>, but this account is not on the admin list.</p>
      <button class="btn block" id="deniedOut" type="button">Sign out</button>
    </div>
  </main>

  <!-- ================= DASHBOARD ================= -->
  <div id="appView" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <img class="brand-logo" src="logo.png" alt="PCES" width="64" height="39">
        <span class="brand-title">Applications</span>
        <span class="spacer"></span>
        <span class="who" id="whoEmail"></span>
        <button class="btn sm" id="refreshBtn" type="button" title="Reload applications">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span class="hide-s">Refresh</span>
        </button>
        <button class="btn sm" id="signOutBtn" type="button">Sign out</button>
      </div>
    </header>

    <main class="wrap">

      <section class="stats" id="stats" aria-label="Summary"></section>

      <section class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Search name, email, phone, Discord, class…" autocomplete="off">
        </div>
        <select id="sort" aria-label="Sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="name">Name A–Z</option>
        </select>
        <button class="btn" id="exportBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>
          Export CSV
        </button>
      </section>

      <div class="chips" id="chips" role="tablist" aria-label="Filter by status"></div>

      <div class="count" id="count" aria-live="polite"></div>

      <section class="panel">
        <div class="loading" id="loading"><span class="spinner big" aria-hidden="true"></span>Loading applications…</div>
        <div class="empty" id="empty" hidden></div>
        <div class="table-scroll" id="tableWrap" hidden>
          <table>
            <thead>
              <tr>
                <th>Applicant</th>
                <th class="hide-m">Class</th>
                <th class="hide-m">Gender</th>
                <th class="hide-m">Phone</th>
                <th class="hide-m">Experience</th>
                <th class="hide-xs">Applied</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>

      <nav class="pager" id="pager" hidden aria-label="Pagination">
        <button class="btn sm" id="prevBtn" type="button">&larr; Previous</button>
        <span id="pageInfo"></span>
        <button class="btn sm" id="nextBtn" type="button">Next &rarr;</button>
      </nav>
    </main>
  </div>

  <!-- ================= DETAIL DRAWER ================= -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="dTitle">Application</h2>
      <button class="icon-close" id="drawerClose" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="supabase.umd.js"></script>
  <script src="admin.js"></script>
</body>
</html>
